name: Publish Docker Image

on:
  workflow_dispatch:
    # Allow manual triggering of the workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # A blip on one matrix job must NOT cancel the other 7 (that made a single
      # transient mirror failure look like a full CI outage).
      fail-fast: false
      # Kept serial on purpose: compiling Asterisk with -j$(nproc) in several jobs
      # at once OOMs the shared runner. With the buildx cache below, cache-hit runs
      # are fast, so serial is cheap now. Bump to 2 only if you move to a bigger runner.
      max-parallel: 1
      matrix:
        asterisk_version: [ master, 23, 22, 21 ]
        base_version: [ 9-minimal ]
        enable_chan_sip: [ false, true ]

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # QEMU removed: we only build linux/amd64 (the runner's native arch), so the
      # emulation layer was dead weight. Re-add it if you ever build linux/arm64.
      - uses: docker/setup-buildx-action@v4

      - name: Get Asterisk commit hash
        id: commit
        run: |
          # Resolve upstream branch HEAD without cloning (faster)
          COMMIT_HASH=$(git ls-remote https://github.com/asterisk/asterisk.git refs/heads/${{ matrix.asterisk_version }} | awk '{print $1}')
          SHORT_HASH=${COMMIT_HASH:0:7}
          echo "hash=${SHORT_HASH}" >> "$GITHUB_OUTPUT"
          echo "Asterisk commit hash: ${SHORT_HASH}"

      - name: Build and push with commit tag
        uses: docker/build-push-action@v7
        with:
          push: true
          # Reuse layers (incl. the long Asterisk compile) across runs. A re-run
          # after a transient failure resumes from cache instead of rebuilding.
          # Scope per matrix combo so the 8 jobs don't clobber each other's cache.
          cache-from: type=gha,scope=${{ matrix.asterisk_version }}-${{ matrix.base_version }}-${{ matrix.enable_chan_sip }}
          cache-to: type=gha,mode=max,scope=${{ matrix.asterisk_version }}-${{ matrix.base_version }}-${{ matrix.enable_chan_sip }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/asterisk-rockylinux:${{ matrix.asterisk_version }}-${{ matrix.base_version }}${{ matrix.enable_chan_sip == true && '-chansip' || '' }}-${{ steps.commit.outputs.hash }}
            ${{ secrets.DOCKER_USERNAME }}/asterisk-rockylinux:${{ matrix.asterisk_version }}-${{ matrix.base_version }}${{ matrix.enable_chan_sip == true && '-chansip' || '' }}
          build-args: |
            ASTERISK_VERSION=${{ matrix.asterisk_version }}
            BASE_VERSION=${{ matrix.base_version }}
            ENABLE_CHAN_SIP=${{ matrix.enable_chan_sip == true && 'true' || 'false' }}
